name: CI

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*', 's*-done']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tests des outils de laboratoire (pilote S3B)
        run: node --test 'lab/**/*.test.mjs'
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    name: Tests d'intégration (PostgreSQL, Redis, S3 réels)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  docker:
    name: Images Docker, environnement complet et E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEED_PASSWORD: ci-demo-password-${{ github.run_id }}
      # Tous les scénarios E2E se connectent depuis la même IP : limite relevée pour ce job.
      RATE_LIMIT_LOGIN_PER_IP: '200'
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d
      - name: Vérifier la santé de la plateforme via Nginx
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health > health.json 2>/dev/null && break
            sleep 3
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8081/ | grep -q '<html'
      - name: Worker de supervision sain (healthcheck propre, sans HTTP)
        run: |
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q worker)")
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "worker : $state"
          [ "$state" = healthy ]
      - name: Agent passerelle conteneurisé sur une interface WireGuard réelle (module noyau)
        env:
          WG_INTERFACE: wgci
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools >/dev/null
          sudo modprobe wireguard
          sudo ip link add wgci type wireguard
          wg genkey | sudo tee /tmp/wgci.key >/dev/null
          sudo wg set wgci private-key /tmp/wgci.key listen-port 51820
          sudo rm -f /tmp/wgci.key
          sudo ip address add 10.200.0.1/24 dev wgci
          sudo ip link set wgci up
          docker compose --profile gateway up -d --build gateway
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q gateway)")
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "passerelle : $state"
          docker compose logs gateway | tail -n 20
          [ "$state" = healthy ]
          # Utilisateur non root ; activation à l'écoute sur l'adresse tunnel SEULEMENT.
          [ "$(docker compose exec -T gateway id -u)" != 0 ]
          sudo ss -ltnH 'sport = :8081' | tee listen.txt
          grep -q '10.200.0.1:8081' listen.txt
          [ "$(grep -cv '10.200.0.1:8081' listen.txt)" = 0 ]
          docker compose --profile gateway stop gateway
      - name: Comptes de démonstration ENTREPRISE_A / ENTREPRISE_B
        run: docker compose run --rm -e SEED_PASSWORD migrate node dist/database/seed.js
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ecsi/e2e...
      - run: pnpm --filter @ecsi/e2e exec playwright install --with-deps chromium
      - name: E2E Sprint 1 et 2 (navigateur réel, pile réelle)
        run: pnpm --filter @ecsi/e2e test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks sur tout l'historique Git
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            git . --config .gitleaks.toml --no-banner --redact --exit-code 1
