name: CI

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*', 's*-done']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Tests des outils de laboratoire (pilote S3B)
        run: node --test 'lab/**/*.test.mjs'
      - name: Scripts de sauvegarde (shellcheck, rétention)
        run: |
          shellcheck -x -e SC1091 ops/backup/*.sh ops/backup/tests/*.sh
          ops/backup/tests/retention.test.sh
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    name: Tests d'intégration (PostgreSQL, Redis, S3 réels)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  docker:
    name: Images Docker, environnement complet et E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SEED_PASSWORD: ci-demo-password-${{ github.run_id }}
      # Tous les scénarios E2E se connectent depuis la même IP : limite relevée pour ce job.
      RATE_LIMIT_LOGIN_PER_IP: '200'
      # L'agent passerelle tourne sur le même runner : Nginx ne doit pas occuper 0.0.0.0:8081.
      NGINX_BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d
      - name: Vérifier la santé de la plateforme via Nginx
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health > health.json 2>/dev/null && break
            sleep 3
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8081/ | grep -q '<html'
      - name: Worker de supervision sain (healthcheck propre, sans HTTP)
        run: |
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q worker)")
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "worker : $state"
          [ "$state" = healthy ]
      - name: Agent passerelle conteneurisé sur une interface WireGuard réelle (module noyau)
        env:
          WG_INTERFACE: wgci
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools >/dev/null
          sudo modprobe wireguard
          sudo ip link add wgci type wireguard
          wg genkey | sudo tee /tmp/wgci.key >/dev/null
          sudo wg set wgci private-key /tmp/wgci.key listen-port 51820
          sudo rm -f /tmp/wgci.key
          sudo ip address add 10.200.0.1/24 dev wgci
          sudo ip link set wgci up
          docker compose --profile gateway up -d --build gateway
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q gateway)")
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "passerelle : $state"
          docker compose logs gateway | tail -n 20
          [ "$state" = healthy ]
          # Utilisateur non root ; activation à l'écoute sur l'adresse tunnel SEULEMENT.
          [ "$(docker compose exec -T gateway id -u)" != 0 ]
          # Nginx du Compose publie aussi 127.0.0.1:8081 (portail) : on contrôle les sockets du
          # processus de l'agent, et l'absence de toute écoute 8081 sur toutes les adresses.
          pid=$(docker inspect -f '{{.State.Pid}}' "$(docker compose ps -q gateway)")
          sudo ss -ltnpH 'sport = :8081' | tee all.txt
          grep "pid=$pid," all.txt | tee listen.txt
          grep -q '10.200.0.1:8081' listen.txt
          [ "$(grep -cv '10.200.0.1:8081' listen.txt)" = 0 ]
          [ "$(grep -cE '(0\.0\.0\.0|\*|\[::\]):8081' all.txt)" = 0 ]
          docker compose --profile gateway stop gateway
      - name: Comptes de démonstration ENTREPRISE_A / ENTREPRISE_B
        run: docker compose run --rm -e SEED_PASSWORD migrate node dist/database/seed.js
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @ecsi/e2e...
      - run: pnpm --filter @ecsi/e2e exec playwright install --with-deps chromium
      - name: E2E Sprint 1 et 2 (navigateur réel, pile réelle)
        run: pnpm --filter @ecsi/e2e test:e2e
      # S3H-H0 : surcouche de production. Variables obligatoires, garde-fous de production du
      # code actifs (NODE_ENV=production), seuls Nginx :80 et PostgreSQL 127.0.0.1 publiés.
      - name: Pile de production (docker-compose.prod.yml, secrets de test générés)
        run: |
          docker compose down -v
          PROD="docker compose -f docker-compose.yml -f docker-compose.prod.yml"
          # Sans variables : refus explicite, sans démarrer.
          if $PROD config >/dev/null 2>config.err; then echo "variables manquantes acceptées"; exit 1; fi
          grep -q 'obligatoire' config.err
          ./scripts/generate-prod-test-env.sh "$RUNNER_TEMP/prod.env"
          PROD="docker compose --env-file $RUNNER_TEMP/prod.env -f docker-compose.yml -f docker-compose.prod.yml"
          $PROD up -d postgres redis s3
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$($PROD ps -q s3)")" = healthy ] && break
            sleep 3
          done
          # Production : le bucket n'est jamais créé par l'API (S3_AUTO_CREATE_BUCKET interdit).
          $PROD exec -T s3 sh -c "echo 's3.bucket.create -name ecsi-prod-test' | weed shell -master=localhost:9333"
          $PROD up -d
          for i in $(seq 1 40); do
            state=$(docker inspect -f '{{.State.Health.Status}}' "$($PROD ps -q api)")
            [ "$state" = healthy ] && break
            sleep 3
          done
          echo "api (production) : $state"
          [ "$state" = healthy ]
          curl -fsS http://localhost/api/v1/health | grep -q '"status":"ok"'
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/docs)" = 404 ]
          [ "$(docker inspect -f '{{.State.Health.Status}}' "$($PROD ps -q worker)")" != unhealthy ]
          # Ports publiés : Nginx 80 sur l'hôte et PostgreSQL sur 127.0.0.1 seulement.
          docker ps --format '{{.Ports}}' | tr ',' '\n' | grep -o '[^ ]*->' | sort -u | tee published.txt
          [ "$(grep -cvE '^(0\.0\.0\.0:80|\[::\]:80|127\.0\.0\.1:5432)->$' published.txt)" = 0 ]
          # Valeur « devonly » : refus par l'API, nom de la variable sans sa valeur.
          if $PROD run --rm --no-deps -e JWT_ACCESS_SECRET=devonly-ci-secret-000000000000000000000000 api >devonly.log 2>&1; then
            echo "valeur devonly acceptée"; exit 1
          fi
          grep -q 'JWT_ACCESS_SECRET : valeur de développement interdite en production' devonly.log
          [ "$(grep -c 'devonly-ci-secret' devonly.log)" = 0 ]
          $PROD down -v
      # S3H-H1 : sauvegarde chiffrée (age) vérifiée, restauration de test réelle et cas négatifs
      # (fichier corrompu, mauvaise clé age, mauvaise ENCRYPTION_KEY, cible de production).
      - name: Sauvegarde PostgreSQL chiffrée et restauration de test
        run: |
          sudo apt-get install -y -qq age >/dev/null
          ops/backup/tests/backup-restore-e2e.sh "$RUNNER_TEMP/sauvegarde"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks sur tout l'historique Git
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            git . --config .gitleaks.toml --no-banner --redact --exit-code 1
