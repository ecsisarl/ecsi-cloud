name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 's*-done']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, typecheck, tests unitaires, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  integration:
    name: Tests d'intégration (PostgreSQL, Redis, S3 réels)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  docker:
    name: Images Docker et démarrage de l'environnement
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build
      - run: docker compose up -d
      - name: Vérifier la santé de la plateforme via Nginx
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/v1/health > health.json 2>/dev/null && break
            sleep 3
          done
          cat health.json
          grep -q '"status":"ok"' health.json
          curl -fsS -o /dev/null http://localhost:8080/
          curl -fsS http://localhost:8081/ | grep -q '<html'
      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  secrets:
    name: Scan de secrets (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks sur tout l'historique Git
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:latest \
            git . --config .gitleaks.toml --no-banner --redact --exit-code 1
