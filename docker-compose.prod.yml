# ECSI CLOUD — surcouche de PRODUCTION (Sprint S3H, étape H0).
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Le Compose de développement (docker-compose.yml) reste inchangé. Cette surcouche :
#   - passe l'API, les migrations, le worker et la passerelle en NODE_ENV=production : les
#     garde-fous de production du code s'appliquent (valeurs de développement refusées, cookies
#     Secure, journaux JSON, création automatique du bucket S3 interdite) ;
#   - rend OBLIGATOIRE chaque secret et chaque URL publique (${VAR:?…}) : la pile refuse de
#     démarrer si l'un d'eux manque, sans jamais afficher de valeur ;
#   - retire Mailpit (profil « dev-mail ») : SMTP réel obligatoire ;
#   - ne publie plus que Nginx, sur les ports 80 et 443 (étape H4 : HTTPS public pour
#     app.mytikcentral.com et enroll.mytikcentral.com, infra/nginx/production/). PostgreSQL
#     reste publié sur 127.0.0.1 seulement, pour l'agent passerelle (réseau de l'hôte) ;
#   - ne démarre plus le portail captif (profil « portail », publication au Sprint 7).
#
# Certificats Let's Encrypt (HTTP-01, webroot) : service certbot (profil « tls ») piloté par
# ops/tls/certificat.sh ; procédure, validation staging puis production et retour arrière :
# docs/DEPLOYMENT.md (« HTTPS public, étape H4 »).
#
# Le bucket S3 n'est jamais créé automatiquement en production : il doit exister (voir
# docs/DEPLOYMENT.md). Les variables obligatoires sont listées dans docs/DEPLOYMENT.md.

x-prod-env: &prod-env
  NODE_ENV: production
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS obligatoire en production}
  DATABASE_URL: postgres://ecsi_app:${ECSI_DB_APP_PASSWORD:?ECSI_DB_APP_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}
  DATABASE_AUTH_URL: postgres://ecsi_auth:${ECSI_DB_AUTH_PASSWORD:?ECSI_DB_AUTH_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD obligatoire}@redis:6379
  S3_BUCKET: ${S3_BUCKET:?S3_BUCKET obligatoire}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID obligatoire}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY obligatoire}
  S3_AUTO_CREATE_BUCKET: 'false'
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET obligatoire}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY obligatoire}
  # Explicite en production : un identifiant erroné rendrait la rotation des clés incohérente.
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?ENCRYPTION_KEY_ID obligatoire}
  COOKIE_SECURE: 'true'
  LOG_PRETTY: 'false'
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:?WEB_PUBLIC_URL obligatoire}
  SMTP_HOST: ${SMTP_HOST:?SMTP_HOST obligatoire (Mailpit est retiré en production)}
  SMTP_PORT: ${SMTP_PORT:?SMTP_PORT obligatoire}
  SMTP_SECURE: ${SMTP_SECURE:-true}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:?SMTP_FROM obligatoire}
  # Enrôlement des routeurs (H4) : ROUTER_ENROLL_PUBLIC_URL vient du Compose de base
  # (https://enroll.mytikcentral.com/api/v1/routers/enroll, ops/tls/preflight.sh). Le certificat
  # public Let's Encrypt est vérifié par le routeur : l'AC privée de laboratoire est neutralisée
  # ici, quelle que soit la valeur du fichier .env.
  ROUTER_ENROLL_CA_URL: ''
  ROUTER_ENROLL_CA_FINGERPRINT: ''

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obligatoire}
      ECSI_DB_MIGRATOR_PASSWORD: ${ECSI_DB_MIGRATOR_PASSWORD:?ECSI_DB_MIGRATOR_PASSWORD obligatoire}
      ECSI_DB_APP_PASSWORD: ${ECSI_DB_APP_PASSWORD:?ECSI_DB_APP_PASSWORD obligatoire}
      ECSI_DB_AUTH_PASSWORD: ${ECSI_DB_AUTH_PASSWORD:?ECSI_DB_AUTH_PASSWORD obligatoire}
      ECSI_DB_WORKER_PASSWORD: ${ECSI_DB_WORKER_PASSWORD:?ECSI_DB_WORKER_PASSWORD obligatoire}
      ECSI_DB_RADIUS_PASSWORD: ${ECSI_DB_RADIUS_PASSWORD:?ECSI_DB_RADIUS_PASSWORD obligatoire}

  # Commande du Compose de base (mot de passe lu dans l'environnement, jamais en argument).
  redis:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD obligatoire}
    ports: !reset []

  s3:
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID obligatoire}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY obligatoire}
    ports: !reset []

  mailpit:
    profiles: ['dev-mail']
    ports: !reset []

  # Seul « migrate » reçoit le propriétaire du schéma (S3H-H7) ; l'API n'a plus de DDL.
  migrate:
    environment:
      <<: *prod-env
      DATABASE_MIGRATOR_URL: postgres://ecsi_migrator:${ECSI_DB_MIGRATOR_PASSWORD:?ECSI_DB_MIGRATOR_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}

  api:
    environment:
      <<: *prod-env
    depends_on: !override
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
    ports: !reset []

  worker:
    environment:
      NODE_ENV: production
      DATABASE_WORKER_URL: postgres://ecsi_worker:${ECSI_DB_WORKER_PASSWORD:?ECSI_DB_WORKER_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}
      RADIUS_NAS_KEY: ${RADIUS_NAS_KEY:?RADIUS_NAS_KEY obligatoire}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY obligatoire}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?ENCRYPTION_KEY_ID obligatoire}

  radius:
    environment:
      ECSI_ENV: production
      RADIUS_DB_PASSWORD: ${ECSI_DB_RADIUS_PASSWORD:?ECSI_DB_RADIUS_PASSWORD obligatoire}
      RADIUS_VOUCHER_LOOKUP_KEY: ${RADIUS_VOUCHER_LOOKUP_KEY:?RADIUS_VOUCHER_LOOKUP_KEY obligatoire}
      RADIUS_NAS_KEY: ${RADIUS_NAS_KEY:?RADIUS_NAS_KEY obligatoire}

  gateway:
    environment:
      NODE_ENV: production
      DATABASE_WORKER_URL: postgres://ecsi_worker:${ECSI_DB_WORKER_PASSWORD:?ECSI_DB_WORKER_PASSWORD obligatoire}@127.0.0.1:5432/${POSTGRES_DB:-ecsi}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY obligatoire}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?ENCRYPTION_KEY_ID obligatoire}

  keys-rotate:
    environment:
      NODE_ENV: production
      DATABASE_MIGRATOR_URL: postgres://ecsi_migrator:${ECSI_DB_MIGRATOR_PASSWORD:?ECSI_DB_MIGRATOR_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}
      DATABASE_AUTH_URL: postgres://ecsi_auth:${ECSI_DB_AUTH_PASSWORD:?ECSI_DB_AUTH_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}
      DATABASE_WORKER_URL: postgres://ecsi_worker:${ECSI_DB_WORKER_PASSWORD:?ECSI_DB_WORKER_PASSWORD obligatoire}@postgres:5432/${POSTGRES_DB:-ecsi}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY obligatoire}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:?ENCRYPTION_KEY_ID obligatoire}

  web:
    ports: !reset []

  # Portail captif : non publié et non démarré en production avant le Sprint 7 (profil
  # « portail » pour le lancer à la main ; Nginx ne dépend plus de lui).
  portal:
    profiles: ['portail']
    ports: !reset []

  # Nginx PRODUCTION (étape H4) : configuration infra/nginx/production/<ECSI_NGINX_MODE>.conf,
  #   https (défaut)   80 = défi ACME + redirection 301 ; 443 = app et enroll (TLS public) ;
  #   acme-bootstrap   80 seulement = défi ACME, 503 ailleurs (obtention du 1er certificat).
  # Certificats en lecture seule (volume letsencrypt), défis ACME en lecture seule (volume
  # acme-webroot) : seul le service certbot y écrit. Aucune dépendance au portail.
  nginx:
    command: ['nginx', '-c', '/etc/nginx/ecsi/${ECSI_NGINX_MODE:-https}.conf', '-g', 'daemon off;']
    volumes: !override
      - type: bind
        source: ./infra/nginx/production
        target: /etc/nginx/ecsi
        read_only: true
      - type: volume
        source: letsencrypt
        target: /etc/letsencrypt
        read_only: true
      - type: volume
        source: acme-webroot
        target: /var/www/acme
        read_only: true
    depends_on: !override
      - api
      - web
    ports: !override
      - '80:8080'
      - '443:8443'

  # Let's Encrypt (étape H4), à la demande seulement, via ops/tls/certificat.sh : aucun port,
  # aucun démarrage automatique, aucune dépendance. Défi HTTP-01 par le webroot servi par Nginx.
  certbot:
    profiles: ['tls']
    image: certbot/certbot:v5.8.0
    restart: 'no'
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme-webroot:/var/www/acme

volumes:
  # Clés privées et certificats Let's Encrypt : à conserver (jamais « down -v » en production).
  letsencrypt:
  acme-webroot:
