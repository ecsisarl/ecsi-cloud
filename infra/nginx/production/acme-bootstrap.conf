# ECSI CLOUD / MyTikCentral — Nginx de PRODUCTION, mode « acme-bootstrap » (Sprint S3H, H4).
# Sélectionné par ECSI_NGINX_MODE=acme-bootstrap, UNIQUEMENT pour obtenir le premier
# certificat (le mode « https » ne démarre pas sans certificat). HTTP seul :
#
#   http://app|enroll.mytikcentral.com/.well-known/acme-challenge/…   défi ACME HTTP-01
#   tout le reste                                                    503 (ou 444 hôte inconnu)
#
# Aucun service interne n'est contacté (ni API, ni web, ni portail) : rien n'est publié en
# HTTP clair pendant l'obtention du certificat. Aucun port 443 n'est écouté dans ce mode.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/ecsi/snippets/http-common.conf;

  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 8080;
    server_name app.mytikcentral.com enroll.mytikcentral.com;

    include /etc/nginx/ecsi/snippets/acme-challenge.conf;

    location / {
      default_type text/plain;
      return 503 "ECSI CLOUD : obtention du certificat HTTPS en cours.\n";
    }
  }
}
