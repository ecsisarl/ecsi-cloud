# ECSI CLOUD — en-têtes transmis aux services internes (inclus dans chaque location : nginx
# n'hérite des proxy_set_header du niveau « server » que si la location n'en définit aucun).
# X-Forwarded-For : l'adresse du client est AJOUTÉE en dernier ; l'API ne fait confiance
# qu'à ce dernier élément (TRUST_PROXY_HOPS=1), une valeur forgée par le client est ignorée.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
# En-tête interne du tableau de bord (proxy.ts -> layout) : jamais accepté du client (H7).
proxy_set_header X-Ecsi-Pathname "";
# Service amont injoignable : échec rapide plutôt que 60 s d'attente (H7).
proxy_connect_timeout 5s;
