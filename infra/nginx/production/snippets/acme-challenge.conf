# ECSI CLOUD — défi ACME HTTP-01 (Let's Encrypt, certbot --webroot). Servi tel quel en HTTP,
# JAMAIS redirigé vers HTTPS. Le volume acme-webroot est partagé avec le service certbot
# (écriture) ; Nginx le monte en lecture seule. Seuls les fichiers déposés par certbot sont
# servis : pas d'index, pas de liste de répertoire, 404 sinon.
location ^~ /.well-known/acme-challenge/ {
  root /var/www/acme;
  default_type text/plain;
  autoindex off;
  try_files $uri =404;
}
