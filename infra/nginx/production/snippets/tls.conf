# ECSI CLOUD — TLS public (Let's Encrypt). Un seul certificat (nom certbot « mytikcentral »)
# pour app.mytikcentral.com et enroll.mytikcentral.com, dans le volume letsencrypt monté en
# lecture seule. Profil « intermediate » de Mozilla : TLS 1.2 et 1.3 (RouterOS v7 compris).
# Pas d'agrafage OCSP : Let's Encrypt a retiré l'OCSP de ses certificats en 2025.
ssl_certificate /etc/letsencrypt/live/mytikcentral/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/mytikcentral/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:ECSI_TLS:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
