# ECSI CLOUD — en-têtes de sécurité des réponses HTTPS (inclus dans chaque location HTTPS :
# un add_header dans une location annule ceux du niveau « server »). « always » : appliqués
# aussi aux erreurs produites par Nginx (404, 405, 429, 502…).
#
# Nginx est la SEULE source de ces en-têtes : ceux de l'API (helmet) et du tableau de bord
# (next.config.ts) sont masqués pour ne jamais envoyer deux valeurs.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;

# HSTS : HTTPS seulement (jamais dans le bloc HTTP). Durée initiale d'UN JOUR, sans
# includeSubDomains ni preload, pour garder un retour arrière possible pendant la validation ;
# à porter à 31536000 (un an) après validation de H4 (docs/DEPLOYMENT.md).
add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
