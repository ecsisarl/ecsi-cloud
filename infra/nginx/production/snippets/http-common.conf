# ECSI CLOUD — réglages communs du bloc « http » de Nginx PRODUCTION (Sprint S3H, étape H4).
# Inclus par https.conf et acme-bootstrap.conf.

server_tokens off;
include /etc/nginx/mime.types;
default_type application/octet-stream;
sendfile on;
keepalive_timeout 65;
client_max_body_size 2m;
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 30s;

# Journal d'accès sans chaîne de requête ($uri au lieu de $request) : un jeton passé dans une
# URL (lien d'invitation, de réinitialisation) n'est jamais écrit dans les journaux.
# Identifiant de requête transmis à l'API (X-Request-Id) pour relier les deux journaux.
log_format ecsi '$remote_addr [$time_local] $host "$request_method $uri $server_protocol" '
                '$status $body_bytes_sent $request_time rid=$request_id "$http_user_agent"';
access_log /var/log/nginx/access.log ecsi;

gzip on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css application/json application/javascript application/problem+json image/svg+xml;

# Limitation de débit de base (renforcée par l'API sur les routes sensibles). Nginx est
# directement exposé (DNS sans proxy Cloudflare) : $binary_remote_addr est le vrai client.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# Enrôlement des routeurs : un appel par routeur ; plusieurs routeurs peuvent partager une
# adresse publique (CGNAT, Starlink), d'où une rafale tolérée.
limit_req_zone $binary_remote_addr zone=enroll:10m rate=30r/m;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
