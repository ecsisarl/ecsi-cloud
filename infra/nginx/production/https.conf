# ECSI CLOUD / MyTikCentral — Nginx de PRODUCTION, mode « https » (Sprint S3H, étape H4).
# Sélectionné par docker-compose.prod.yml (ECSI_NGINX_MODE=https, valeur par défaut).
#
#   http://<hôte>/.well-known/acme-challenge/…  défi ACME HTTP-01, jamais redirigé
#   http://app|enroll.mytikcentral.com/…         301 vers https://
#   https://app.mytikcentral.com/                tableau de bord (web) ; /api/ -> API
#   https://enroll.mytikcentral.com              POST /api/v1/routers/enroll EXACTEMENT, rien d'autre
#   tout autre nom d'hôte (ou adresse IP)        connexion fermée sans réponse (444)
#
# Le portail captif n'est PAS publié (Sprint 7) : aucune référence au service « portal », Nginx
# démarre sans lui. PostgreSQL, Redis, S3, l'API et le web ne sont jamais publiés directement.
# Écoute interne 8080 (HTTP) et 8443 (HTTPS), publiées sur 80 et 443 par docker-compose.prod.yml.
# Certificat : volume letsencrypt (ops/tls/certificat.sh) ; absent, Nginx refuse de démarrer :
# démarrer d'abord en mode « acme-bootstrap » (docs/DEPLOYMENT.md, étape H4).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/ecsi/snippets/http-common.conf;

  map $request_method $enroll_allow {
    POST '';
    default 'POST';
  }

  # Tableau de bord : lecture seule côté Nginx (H7). Il n'utilise aucune Server Action ;
  # les écritures passent toutes par /api/. Les POST de robots (« Server Reference ID did
  # not match ») sont refusés ici sans atteindre Next.js.
  map $request_method $web_allow {
    GET '';
    HEAD '';
    default 'GET, HEAD';
  }

  upstream ecsi_api { server api:4000; keepalive 16; }
  upstream ecsi_web { server web:3000; keepalive 16; }

  # --- HTTP (80) ---------------------------------------------------------------------------

  # Hôte inconnu ou accès par adresse IP : connexion fermée, sans réponse.
  server {
    listen 8080 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 8080;
    server_name app.mytikcentral.com enroll.mytikcentral.com;

    include /etc/nginx/ecsi/snippets/acme-challenge.conf;

    # Pas de HSTS en HTTP (ignoré par les navigateurs, interdit par la RFC 6797).
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- HTTPS (443) -------------------------------------------------------------------------

  # Hôte inconnu : même certificat (un client sans SNI reste servi par nom d'hôte), mais la
  # requête est refusée (connexion fermée sans réponse).
  server {
    listen 8443 ssl default_server;
    http2 on;
    server_name _;
    include /etc/nginx/ecsi/snippets/tls.conf;
    return 444;
  }

  # Tableau de bord et API.
  server {
    listen 8443 ssl;
    http2 on;
    server_name app.mytikcentral.com;
    include /etc/nginx/ecsi/snippets/tls.conf;
    limit_conn perip 100;

    # Santé détaillée (version, dépendances, latences) : jamais publique (H7). Elle reste
    # disponible en interne : healthcheck Docker, tableau de bord côté serveur,
    # `docker compose exec api wget -qO- http://127.0.0.1:4000/api/v1/health`.
    # Seule la vivacité minimale ({"status":"ok"}, sans dépendance) est publiée.
    location = /api/v1/health/live {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/ecsi/snippets/proxy-headers.conf;
      proxy_set_header Connection "";
      include /etc/nginx/ecsi/snippets/security-headers.conf;
      proxy_pass http://ecsi_api;
    }
    location ^~ /api/v1/health {
      include /etc/nginx/ecsi/snippets/security-headers.conf;
      return 404;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      include /etc/nginx/ecsi/snippets/proxy-headers.conf;
      proxy_set_header Connection "";
      include /etc/nginx/ecsi/snippets/security-headers.conf;
      proxy_pass http://ecsi_api;
    }

    # WebSocket accepté (Upgrade/Connection) pour le tableau de bord.
    location / {
      limit_req zone=web burst=200 nodelay;
      # 405 avec « Allow: GET, HEAD » ($web_allow est vide pour GET et HEAD : en-tête absent).
      add_header Allow $web_allow always;
      if ($web_allow) {
        return 405;
      }
      include /etc/nginx/ecsi/snippets/proxy-headers.conf;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      include /etc/nginx/ecsi/snippets/security-headers.conf;
      proxy_pass http://ecsi_web;
    }
  }

  # Enrôlement des routeurs MikroTik : une seule requête publiée, appelée par le script
  # RouterOS (/tool/fetch … check-certificate=yes) : POST /api/v1/routers/enroll.
  server {
    listen 8443 ssl;
    http2 on;
    server_name enroll.mytikcentral.com;
    include /etc/nginx/ecsi/snippets/tls.conf;
    limit_conn perip 100;

    location = /api/v1/routers/enroll {
      include /etc/nginx/ecsi/snippets/security-headers.conf;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      # Ligne de requête BRUTE exacte : aucune chaîne de requête, aucune variante encodée
      # (%65nroll), aucun double « / » ni « .. », même si Nginx les normaliserait.
      if ($request_uri != "/api/v1/routers/enroll") {
        return 404;
      }
      # 405 avec « Allow: POST » ($enroll_allow est vide pour POST : en-tête alors absent).
      add_header Allow $enroll_allow always;
      if ($request_method != POST) {
        return 405;
      }
      limit_req zone=enroll burst=20 nodelay;
      client_max_body_size 4k;
      include /etc/nginx/ecsi/snippets/proxy-headers.conf;
      proxy_set_header Connection "";
      # URI fixe : l'API reçoit exactement ce chemin.
      proxy_pass http://ecsi_api/api/v1/routers/enroll;
    }

    # Tout autre chemin de ce nom d'hôte : refusé.
    location / {
      include /etc/nginx/ecsi/snippets/security-headers.conf;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
      return 404;
    }
  }
}
