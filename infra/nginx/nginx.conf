# Nginx de développement : reproduit le découpage de la production.
#   http://localhost:8080  -> dashboard (web) + API sous /api/
#   http://localhost:8081  -> portail captif
# En production : TLS, HSTS et domaines réels (voir docs/DEPLOYMENT.md).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 2m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types text/plain text/css application/json application/javascript application/problem+json image/svg+xml;

  # Limitation de débit de base (renforcée par l'API sur les routes sensibles).
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=portal:10m rate=10r/s;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream ecsi_api { server api:4000; keepalive 16; }
  upstream ecsi_web { server web:3000; keepalive 16; }
  upstream ecsi_portal { server portal:3001; keepalive 8; }

  server {
    listen 8080;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      proxy_set_header Connection "";
      proxy_pass http://ecsi_api;
    }

    location / {
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_pass http://ecsi_web;
    }
  }

  server {
    listen 8081;
    server_name _;

    location / {
      limit_req zone=portal burst=20 nodelay;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://ecsi_portal;
    }
  }
}
