# FreeRADIUS 3.2 — configuration ECSI CLOUD (lot B, docs/RADIUS.md).
# Écrite pour ECSI : seuls les modules nécessaires sont chargés (sql, chap, detail, expr,
# always). Aucun secret dans ce fichier : clés et mot de passe viennent de l'environnement
# ($ENV{…}), vérifié par ecsi-radius-entrypoint.
prefix = /usr
exec_prefix = ${prefix}
sysconfdir = /etc
localstatedir = /var
sbindir = ${exec_prefix}/sbin
logdir = /run/radiusd
raddbdir = ${sysconfdir}/freeradius
radacctdir = /var/spool/radacct
name = radiusd
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
run_dir = /run/radiusd
db_dir = ${raddbdir}
libdir = /usr/lib/freeradius
pidfile = ${run_dir}/${name}.pid

max_request_time = 30
cleanup_delay = 5
max_requests = 16384
hostname_lookups = no

log {
	destination = stdout
	colourise = no
	stripped_names = no
	# Jamais d'identifiant ni de mot de passe dans les journaux.
	auth = no
	auth_badpass = no
	auth_goodpass = no
}

security {
	allow_core_dumps = no
	max_attributes = 200
	# Ralentit les essais de codes (une réponse de refus au plus tôt après 1 s).
	reject_delay = 1
	status_server = no
	# BlastRADIUS : Message-Authenticator exigé dans les Access-Request (RouterOS 7 l'envoie,
	# require-message-auth=yes-for-request-resp par défaut) ; aussi forcé client par client
	# (FreeRADIUS-Client-Require-MA, sites-enabled/ecsi).
	require_message_authenticator = yes
	limit_proxy_state = yes
	allow_vulnerable_openssl = no
}

proxy_requests = no

# Un seul client : la plage tunnel WireGuard. Chaque routeur y est reconnu dynamiquement
# (serveur dynamic_clients) avec SON secret ; une adresse inconnue est ignorée.
client ecsi_tunnel {
	ipaddr = $ENV{RADIUS_CLIENT_CIDR}
	dynamic_clients = dynamic_clients
	lifetime = 300
}

thread pool {
	start_servers = 4
	max_servers = 16
	min_spare_servers = 2
	max_spare_servers = 8
	max_requests_per_server = 0
	auto_limit_acct = no
}

modules {
	$INCLUDE mods-enabled/
}

instantiate {
}

policy {
}

$INCLUDE sites-enabled/
