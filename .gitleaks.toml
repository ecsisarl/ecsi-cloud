# Configuration du scan de secrets (gitleaks), exécuté en CI et recommandé en pre-commit.
title = "ECSI CLOUD"

[extend]
useDefault = true

[allowlist]
description = "Valeurs de développement explicitement factices (marqueur devonly) et identifiants de tests"
regexes = [
  '''devonly[-_a-z0-9]*''',
  '''test-(superuser|migrator|app)-password''',
  '''ecsi-test-secret''',
  '''test-(auth-password|Motdepasse-ecsi-2026|jwt-access-secret-[0-9a-f]+)''',
  '''mot-de-passe-faux-[0-9]+''',
  # Jeton JWT non signé (alg « none ») utilisé pour vérifier qu'il est refusé.
  '''eyJhbGciOiJub25lIn0\.[A-Za-z0-9_-]+\.''',
]
paths = [
  '''pnpm-lock\.yaml''',
]
# Faux positifs « curl-auth-user » du commit b3dc263 : `curl -u "ecsi-svc:$(cat fichier)"` dans
# des scripts de laboratoire (mot de passe lu à l'exécution, aucune valeur dans le dépôt). Les
# scripts passent désormais les identifiants par `curl -K` (fichier de configuration).
commits = [
  '''b3dc2630fe421771fcfdb0677af75347ef918da2''',
]
