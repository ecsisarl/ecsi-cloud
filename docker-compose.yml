# ECSI CLOUD — environnement de développement complet.
#
#   docker compose up --build
#
#   Dashboard        http://localhost:8080
#   API (santé)      http://localhost:8080/api/v1/health
#   Documentation    http://localhost:8080/api/docs
#   Portail captif   http://localhost:8081
#   Mailpit          http://localhost:8025
#
# Comptes de démonstration (ENTREPRISE_A / ENTREPRISE_B, voir docs/SECURITY.md) :
#   docker compose run --rm -e SEED_PASSWORD='…12 caractères min…' migrate node dist/database/seed.js
#
# Les valeurs par défaut ci-dessous contiennent le marqueur « devonly » : elles ne servent
# qu'en développement local et l'API refuse de démarrer en production avec elles.
# Pour les personnaliser : cp .env.example .env (le fichier .env n'est jamais commité).

name: ecsi-cloud

x-api-env: &api-env
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_VERSION: ${APP_VERSION:-0.1.0-dev}
  API_PORT: 4000
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081,http://localhost:3000,http://localhost:3001}
  DATABASE_URL: postgres://ecsi_app:${ECSI_DB_APP_PASSWORD:-devonly-app-password}@postgres:5432/${POSTGRES_DB:-ecsi}
  DATABASE_MIGRATOR_URL: postgres://ecsi_migrator:${ECSI_DB_MIGRATOR_PASSWORD:-devonly-migrator-password}@postgres:5432/${POSTGRES_DB:-ecsi}
  DATABASE_AUTH_URL: postgres://ecsi_auth:${ECSI_DB_AUTH_PASSWORD:-devonly-auth-password}@postgres:5432/${POSTGRES_DB:-ecsi}
  REDIS_URL: redis://:${REDIS_PASSWORD:-devonly-redis-password}@redis:6379
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: ${S3_BUCKET:-ecsi-dev}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ecsi-devonly}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devonly-s3-secret-key}
  S3_FORCE_PATH_STYLE: 'true'
  S3_AUTO_CREATE_BUCKET: 'true'
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-devonly-jwt-access-secret-change-me-0000}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-devonlydevonlydevonlydevonlydevonlydevonlyA=}
  # Rotation de la clé (docs/SECURITY.md) : identifiant de la clé active, anciennes clés.
  ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-k1}
  ENCRYPTION_PREVIOUS_KEYS: ${ENCRYPTION_PREVIOUS_KEYS:-}
  # Anti force brute : 20 connexions / IP / 15 min. Les E2E le relèvent (une seule IP).
  RATE_LIMIT_LOGIN_PER_IP: ${RATE_LIMIT_LOGIN_PER_IP:-20}
  # HTTP en local : cookies non « Secure ». En production (HTTPS), COOKIE_SECURE est imposé.
  COOKIE_SECURE: 'false'
  WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:8080}
  SMTP_HOST: mailpit
  SMTP_PORT: 1025
  SMTP_FROM: ${SMTP_FROM:-ECSI CLOUD <no-reply@ecsi.local>}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecsi}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devonly-postgres-password}
      ECSI_DB_MIGRATOR_PASSWORD: ${ECSI_DB_MIGRATOR_PASSWORD:-devonly-migrator-password}
      ECSI_DB_APP_PASSWORD: ${ECSI_DB_APP_PASSWORD:-devonly-app-password}
      ECSI_DB_AUTH_PASSWORD: ${ECSI_DB_AUTH_PASSWORD:-devonly-auth-password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-devonly-redis-password}',
        '--appendonly',
        'yes',
      ]
    volumes:
      - redis-data:/data
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-devonly-redis-password}

  # Stockage objet S3 compatible pour le développement (SeaweedFS).
  # L'image officielle MinIO n'est plus publiée sur Docker Hub ; voir docs/adr/0009-stockage-objet-dev.md.
  s3:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - >-
        printf '{"identities":[{"name":"ecsi","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -volume.max=10 -master.volumeSizeLimitMB=256
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-ecsi-devonly}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-devonly-s3-secret-key}
    volumes:
      - s3-data:/data
    ports:
      - '127.0.0.1:8333:8333'
    healthcheck:
      # Sans identifiants, la passerelle S3 répond 403 : elle est donc prête.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8333/ 2>&1 | grep -q 403']
      interval: 5s
      timeout: 3s
      retries: 30

  # Capture tous les e-mails envoyés en développement (aucun e-mail ne sort).
  mailpit:
    image: axllent/mailpit:v1.31
    restart: unless-stopped
    ports:
      - '127.0.0.1:8025:8025'
      - '127.0.0.1:1025:1025'

  # Applique les migrations puis s'arrête. L'API attend sa réussite.
  migrate:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    image: ecsi-cloud/api:dev
    command: ['node', 'dist/database/migrate.js']
    environment:
      <<: *api-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ecsi-cloud/api:dev
    restart: unless-stopped
    environment:
      <<: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - '127.0.0.1:4000:4000'

  web:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP: web
        PORT: 3000
    image: ecsi-cloud/web:dev
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'

  portal:
    build:
      context: .
      dockerfile: infra/docker/next.Dockerfile
      args:
        APP: portal
        PORT: 3001
    image: ecsi-cloud/portal:dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'

  nginx:
    image: nginx:1-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
      - web
      - portal
    ports:
      - '8080:8080'
      - '8081:8081'

volumes:
  postgres-data:
  redis-data:
  s3-data:
